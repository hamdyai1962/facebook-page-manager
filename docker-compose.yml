version: '3.9'
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facebook-page-manager-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
